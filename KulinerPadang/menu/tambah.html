<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RM Padang | Tambah Menu</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>RM Padang</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="menu/list.html">Daftar Menu</a></li>
                <li><a href="menu/tambah.html">Tambah Menu</a></li>
                <li><a href="../ulasan/list.html">Daftar Ulasan</a></li>
                <li><a href="../ulasan/tambah.html">Tambah Ulasan</a></li>
                <li><a href="../kontak/list.html">Kontak</a></li></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Menu</h2>
            <form>
                <p>
                    <label for="nama">Nama Menu</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="kategori">Kategori</label><br>
                    <select id="kategori" name="kategori">
                        <option value="makanan">Makanan</option>
                        <option value="minuman">Minuman</option>
                    </select>
                </p>
                <p>
                    <label for="harga">Harga</label><br>
                    <input type="number" id="harga" name="harga" required>
                </p>
                <p>
                    <label for="stok">Stok</label><br>
                    <input type="number" id="stok" name="stok" min="0" required>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; RM-Padang</p>
    </footer>
</body>
</html>
